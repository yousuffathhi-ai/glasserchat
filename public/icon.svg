<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1F242D" />
      <stop offset="60%" stop-color="#121417" />
      <stop offset="100%" stop-color="#08090B" />
    </radialGradient>
    
    <!-- Liquid Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA6" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#FFDF73" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Subtle Gold Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="230" r="140" fill="#D4AF37" opacity="0.18" filter="url(#goldGlow)" />

  <!-- Chat Bubble 1 (Main Glass Chat Shield) -->
  <g filter="url(#softShadow)">
    <path d="M140 150 C140 110, 372 110, 372 150 L372 270 C372 310, 270 310, 240 340 L210 370 C200 380, 185 375, 185 360 L185 310 C150 310, 140 290, 140 270 Z" 
          fill="#16191F" 
          fill-opacity="0.85"
          stroke="url(#goldGrad)" 
          stroke-width="8" />

    <!-- Glass Highlight Sheen -->
    <path d="M155 145 C180 130, 330 130, 355 145 C360 165, 340 185, 256 185 C172 185, 150 165, 155 145 Z" 
          fill="url(#accentGrad)" 
          opacity="0.15" />
  </g>

  <!-- Inner Sparkle / Star Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Central 4-pointed Star -->
    <path d="M256 160 Q256 220 316 220 Q256 220 256 280 Q256 220 196 220 Q256 220 256 160 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Core Diamond Light -->
    <polygon points="256,205 271,220 256,235 241,220" fill="#FFFFFF" />
  </g>

  <!-- Floating Mini Chat Dot Sparkles -->
  <circle cx="195" cy="275" r="7" fill="url(#goldGrad)" />
  <circle cx="317" cy="275" r="7" fill="url(#goldGrad)" />
  <circle cx="256" cy="315" r="5" fill="#FFDF73" />
</svg>
