<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Obsidian Black -->
    <radialGradient id="obsidianBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16191E" />
      <stop offset="50%" stop-color="#0B0D0E" />
      <stop offset="100%" stop-color="#050607" />
    </radialGradient>
    
    <!-- Neon Lime to Emerald Glow -->
    <linearGradient id="neonLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFF66" />
      <stop offset="35%" stop-color="#CCFF00" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glassmorphic Gradient -->
    <linearGradient id="glassShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A221E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B0D0E" stop-opacity="0.95" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#CCFF00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#obsidianBg)" />
  
  <!-- Outer Emerald & Neon Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#neonLimeGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ambient Backlight -->
  <circle cx="256" cy="240" r="130" fill="#CCFF00" opacity="0.12" filter="url(#emeraldGlow)" />

  <!-- Glass Chat Bubble Shape -->
  <g filter="url(#neonDropShadow)">
    <path d="M140 150 C140 110, 372 110, 372 150 L372 270 C372 310, 270 310, 240 340 L205 375 C195 385, 180 380, 180 365 L180 310 C145 310, 140 290, 140 270 Z" 
          fill="url(#glassShield)" 
          stroke="url(#neonLimeGrad)" 
          stroke-width="7" />

    <!-- Glass Specular Highlight -->
    <path d="M160 145 C190 125, 320 125, 350 145 C355 165, 335 180, 256 180 C175 180, 155 165, 160 145 Z" 
          fill="#FFFFFF" 
          opacity="0.1" />
  </g>

  <!-- Central Dynamic Waveform & Sparkle -->
  <g filter="url(#emeraldGlow)">
    <!-- Central PGV Creation Sparkle -->
    <path d="M256 175 Q256 225 306 225 Q256 225 256 275 Q256 225 206 225 Q256 225 256 175 Z" 
          fill="url(#neonLimeGrad)" />
    
    <!-- Core Bright Dot -->
    <circle cx="256" cy="225" r="7" fill="#FFFFFF" />
  </g>

  <!-- Audio Waves / WebRTC Calling Indicators -->
  <circle cx="195" cy="275" r="6" fill="#CCFF00" opacity="0.9" />
  <circle cx="317" cy="275" r="6" fill="#CCFF00" opacity="0.9" />
  <circle cx="256" cy="315" r="4.5" fill="#10B981" />
</svg>
